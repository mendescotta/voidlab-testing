name: overlay-report

# Weekly: one issue listing overlay templates official Void has caught up with, and newer upstream
# releases for packages that auto-update does not touch (tier manual or unlisted). Read-only apart from that issue.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: overlay-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/void-linux/void-glibc-full@sha256:9533af64ff46c0173b671ebc3477857c622afdb36eaf11f51419adb0a32f9f90
    steps:
      - name: Install git
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          retry() { n=0; until "$@"; do n=$((n + 1)); [ "$n" -lt 3 ] || return 1; echo "retrying ($n/3): $*" >&2; sleep 5; done; }
          if ! retry xbps-install -Syu xbps; then
            echo "CI repository unavailable; falling back to the default Void repository" >&2
            sed -i 's|repo-ci|repo-default|g' /etc/xbps.d/*-repository-*.conf
            retry xbps-install -Syu xbps
          fi
          retry xbps-install -yu
          retry xbps-install -y git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-ci

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          VOIDLAB_GH_REPO: ${{ github.repository }}
          VOIDLAB_NO_BOOTSTRAP: "1"
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          sudo -Eu builder env HOME=/home/builder bash tools/ci-overlay-report.sh

      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: 'echo "overlay-report: $JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"'
